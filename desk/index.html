.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.mark{width:44px;height:44px;display:block;margin:0 auto 10px}

<script>
(function(){
"use strict";
const blob=JSON.parse(document.getElementById("blob").textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(pass,b){
  const raw=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(b.salt),iterations:b.iterations,hash:"SHA-256"},raw,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function open(pass,b){const k=await keyFor(pass,b);return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.iv)},k,b64(b.ct)));}
async function unlock(pass,keep){
  const html=await open(pass,blob);
  // the full page refetches data.json every five minutes; route that to the encrypted copy and decrypt it
  // with the same passphrase, which stays in this window only
  window.__orionPass=pass;
  const realFetch=window.fetch.bind(window);
  window.fetch=function(url,opts){
    if(typeof url==="string"&&url.startsWith("data.json")){
      return realFetch("data.json.enc?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(b=>open(window.__orionPass,b))
        .then(txt=>new Response(txt,{status:200,headers:{"Content-Type":"application/json"}}));
    }
    return realFetch(url,opts);
  };
  try{if(keep)localStorage.setItem("orion.desk",pass);else localStorage.removeItem("orion.desk");}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err");
f.addEventListener("submit",async ev=>{ev.preventDefault();err.textContent="";const pass=document.getElementById("p").value;
  try{await unlock(pass,document.getElementById("keep").checked);}catch(e){err.textContent="That passphrase does not open this page.";}});
